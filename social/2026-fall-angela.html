<!DOCTYPE html>
<html lang="en-CA"><head>
<meta charset="UTF-8">
<title>F2BF Fall 2026 — Broken Hallelujah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
  /* Skeleton, palette, plate grade and copy pattern are lifted unchanged from
     2026-27-tiles.html (the Olthuis/Berglund pair) so this tile sits in the
     same series. What differs: the course title is quoted, so its opening
     quote hangs into the margin, the same treatment as the Christian Courier
     ads for this course. See .bill__title below. */
  :root {
    --teal-deep: #0F2631;
    --teal:      #1B3A4B;
    --red:       #C83C2C;
    --cream:     #F0EBE3;
    --slate:     #BCC7D0;
    --display: 'Playfair Display', Georgia, serif;
    --text:    'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #2b3238;
    padding: 48px;
    display: flex; flex-direction: column; gap: 48px; align-items: flex-start;
    -webkit-font-smoothing: antialiased;
  }

  /* ════════════════════════════════════════════════════════════
     CANVAS — 1080 × 1350 (4:5)
     ════════════════════════════════════════════════════════════ */
  .canvas {
    position: relative;
    width: 1080px; height: 1350px;
    overflow: hidden;
    background: var(--teal-deep);
    font-family: var(--text);
    flex: none;
  }

  /* ─── Portrait plate ─── */
  .plate { position: absolute; top: 0; left: 0; width: 1080px; height: 830px; }
  /* Series grade. Angela is a pale, high-key sitter like the two it was set
     on, so it applies as-is; it also quiets the orange autumn bokeh behind
     her, which would otherwise outshout the teal. */
  .plate__img {
    width: 100%; height: 100%; display: block;
    filter: saturate(0.52) contrast(1.08) brightness(0.97);
  }
  .plate__tint {
    position: absolute; inset: 0;
    background: var(--teal);
    mix-blend-mode: color;
    opacity: 0.3;
  }
  /* Scrim for the masthead, then the dissolve into the type field.
     The series dissolve starts at 46% and goes solid at 78% (y≈647); here
     it starts at 62% and goes solid at 81% (y≈672). A two-line title starts
     the type field at y≈677, so the later dissolve costs nothing, and it
     keeps her chin (y≈505) and earrings in the light. */
  .plate__wash {
    position: absolute; inset: 0;
    background: linear-gradient(
      180deg,
      rgba(15,38,49,0.80)  0%,
      rgba(15,38,49,0.54)  8%,
      rgba(15,38,49,0.26) 17%,
      rgba(15,38,49,0.11) 27%,
      rgba(15,38,49,0.11) 62%,
      rgba(15,38,49,0.48) 70%,
      rgba(15,38,49,0.86) 76%,
      #0F2631 81%
    );
  }
  .canvas__grain {
    position: absolute; inset: 0; z-index: 2;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }

  /* ─── Masthead ─── */
  .masthead { position: absolute; top: 72px; left: 84px; z-index: 3; }
  .masthead__program {
    font-size: 23px; font-weight: 700;
    letter-spacing: 0.235em; text-transform: uppercase;
    color: var(--cream);
  }
  .masthead__org {
    margin-top: 11px;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--cream); opacity: 0.76;
  }

  /* ─── Type field ─── */
  .bill { position: absolute; z-index: 3; left: 84px; right: 84px; bottom: 198px; }
  .bill__meta {
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.215em; text-transform: uppercase;
    color: var(--slate);
  }
  .bill__rule { width: 76px; height: 4px; background: var(--red); margin: 24px 0 28px; }
  .bill__title {
    font-family: var(--display); font-weight: 900;
    font-size: 96px; line-height: 0.94; letter-spacing: -0.026em;
    color: var(--cream);
  }
  /* Hung quotes: the opening mark sits in the margin so "Broken" and
     "Hallelujah" share the bill's left edge. */
  .bill__q { position: absolute; transform: translateX(-100%); }
  .bill__subtitle {
    margin-top: 22px;
    font-family: var(--display); font-style: italic; font-weight: 400;
    font-size: 32px; line-height: 1.3;
    color: var(--cream); opacity: 0.72;
    max-width: 840px;
  }
  .bill__byline {
    margin-top: 40px; padding-top: 30px;
    border-top: 1px solid rgba(240,235,227,0.2);
  }
  .bill__name {
    font-size: 38px; font-weight: 700; line-height: 1.15;
    color: var(--cream);
  }
  .bill__role {
    margin-top: 8px;
    font-size: 21px; font-weight: 400; line-height: 1.4;
    color: var(--slate);
  }
  .bill__role em { font-style: italic; }

  /* ─── Enrolment band ─── */
  .band {
    position: absolute; z-index: 3; left: 0; right: 0; bottom: 0;
    height: 122px; background: var(--red);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 84px;
  }
  .band__call {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.17em; text-transform: uppercase;
    color: #FFF6F1;
  }
  .band__mark { height: 50px; width: auto; display: block; }
</style>
</head>
<body>

<!-- ══════════════ TILE — Angela Reitsma Bick ══════════════ -->
<div class="canvas" id="tile-angela">
  <div class="plate">
    <img class="plate__img" src="plate-angela.jpg" alt="Angela Reitsma Bick">
    <div class="plate__tint"></div>
    <div class="plate__wash"></div>
  </div>
  <div class="canvas__grain"></div>

  <div class="masthead">
    <div class="masthead__program">Free to be Faithful</div>
    <div class="masthead__org">Institute for Christian Studies</div>
  </div>

  <div class="bill">
    <div class="bill__meta">Tuesdays · Six weeks · Online</div>
    <div class="bill__rule"></div>
    <h1 class="bill__title"><span class="bill__q">“</span>Broken<br>Hallelujah”</h1>
    <p class="bill__subtitle">Faith, deconstruction, and spirituality through music</p>
    <div class="bill__byline">
      <div class="bill__name">Angela Reitsma Bick</div>
      <div class="bill__role">Author of <em>Blessed Are the Undone</em> · Former editor-in-chief, <em>Christian Courier</em></div>
    </div>
  </div>

  <div class="band">
    <div class="band__call">Now enrolling · Nov 3 – Dec 8, 2026</div>
    <img class="band__mark" src="../assets/img/ICS+logo+white-01.png" alt="Institute for Christian Studies">
  </div>
</div>

</body></html>
