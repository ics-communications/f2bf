<!DOCTYPE html>
<html lang="en-CA"><head>
<meta charset="UTF-8">
<title>F2BF Fall 2026 Big Read tile — Defying Tyrants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
  :root {
    --teal-deep: #0F2631;
    --teal:      #1B3A4B;
    --red:       #C83C2C;
    --cream:     #F0EBE3;
    --slate:     #BCC7D0;
    --display: 'Playfair Display', Georgia, serif;
    --text:    'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #2b3238;
    padding: 48px;
    display: flex; flex-direction: column; gap: 48px; align-items: flex-start;
    -webkit-font-smoothing: antialiased;
  }

  /* ════════════════════════════════════════════════════════════
     CANVAS — 1080 × 1350 (4:5)

     The course tiles in this series are portrait-plate tiles: a face
     fills the top two thirds and dissolves into the type field. A Big
     Read is about a book, so the object changes and the construction
     with it — the cover is lit and floated on the ground, the author
     drops to a roundel in the byline. Same masthead, same rule, same
     red band, so it still reads as one series in a feed.
     ════════════════════════════════════════════════════════════ */
  .canvas {
    position: relative;
    width: 1080px; height: 1350px;
    overflow: hidden;
    background: var(--teal-deep);
    font-family: var(--text);
    flex: none;
  }

  /* The cloak in the cover art is the only warm thing in the frame.
     This is that red spilling onto the ground behind the book. */
  .canvas__spill {
    position: absolute; z-index: 1;
    width: 1500px; height: 1500px; left: 50%; top: 112px;
    transform: translateX(-50%);
    background: radial-gradient(circle at 50% 50%,
      rgba(200,60,44,0.38) 0%, rgba(200,60,44,0.15) 30%, rgba(200,60,44,0) 58%);
  }
  .canvas__grain {
    position: absolute; inset: 0; z-index: 4;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }

  /* ─── Masthead ─── */
  .masthead { position: absolute; top: 72px; left: 84px; z-index: 3; }
  .masthead__program {
    font-size: 23px; font-weight: 700;
    letter-spacing: 0.235em; text-transform: uppercase;
    color: var(--cream);
  }
  .masthead__org {
    margin-top: 11px;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--cream); opacity: 0.76;
  }

  /* ─── The book ─── */
  .book {
    position: absolute; z-index: 3;
    right: 84px; top: 206px;
    width: 396px;
  }
  .book__img {
    display: block; width: 100%; height: auto; border-radius: 3px;
    box-shadow:
      0 3px 6px rgba(0,0,0,0.42),
      0 26px 54px rgba(0,0,0,0.5),
      0 62px 120px rgba(0,0,0,0.42);
  }
  /* The gutter shadow that says "bound object", not "picture of a cover" */
  .book::after {
    content: ''; position: absolute; inset: 0 auto 0 0; width: 15px;
    background: linear-gradient(90deg,
      rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.13) 46%, rgba(0,0,0,0) 100%);
    border-radius: 3px 0 0 3px;
  }

  /* ─── Type field ─── */
  .bill { position: absolute; z-index: 3; left: 84px; top: 222px; width: 492px; }
  .bill__meta {
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.215em; text-transform: uppercase;
    color: var(--slate);
  }
  .bill__rule { width: 76px; height: 4px; background: var(--red); margin: 24px 0 28px; }
  .bill__title {
    font-family: var(--display); font-weight: 900;
    font-size: 108px; line-height: 0.90; letter-spacing: -0.03em;
    color: var(--cream);
  }
  .bill__subtitle {
    margin-top: 24px;
    font-family: var(--display); font-style: italic; font-weight: 400;
    font-size: 31px; line-height: 1.3;
    color: var(--cream); opacity: 0.74;
  }

  /* ─── Byline: author roundel ─── */
  .byline {
    /* Baselines with the foot of the cover, so the two columns close
       together and the air below belongs to the date alone. */
    position: absolute; z-index: 3; left: 84px; top: 700px;
    display: grid; grid-template-columns: 116px 1fr; column-gap: 26px;
    align-items: center; width: 560px;
  }
  .byline__face {
    width: 116px; height: 116px; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 2px rgba(240,235,227,0.22);
  }
  .byline__face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .byline__with {
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--red);
  }
  .byline__name {
    margin-top: 8px;
    font-size: 38px; font-weight: 700; line-height: 1.1;
    color: var(--cream);
  }
  .byline__role {
    margin-top: 7px;
    font-size: 20px; line-height: 1.35; color: var(--slate);
  }

  /* ─── The date, given its own weight ─── */
  .when {
    position: absolute; z-index: 3; left: 84px; right: 84px; bottom: 268px;
    padding-top: 30px; border-top: 1px solid rgba(240,235,227,0.2);
    display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
  }
  .when__date {
    font-family: var(--display); font-weight: 900;
    font-size: 54px; line-height: 1; letter-spacing: -0.02em;
    color: var(--cream);
  }
  .when__time {
    font-size: 25px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--slate);
  }
  .when__free {
    font-size: 19px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: #FFF6F1; background: var(--red);
    padding: 9px 22px; border-radius: 100px;
  }

  /* ─── Call band ─── */
  .band {
    position: absolute; z-index: 3; left: 0; right: 0; bottom: 0;
    height: 122px; background: var(--red);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 84px;
  }
  .band__call {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.17em; text-transform: uppercase;
    color: #FFF6F1;
  }
  .band__mark { height: 50px; width: auto; display: block; }
</style>
</head>
<body>

<!-- ══════════════ TILE — Fall 2026 Big Read ══════════════ -->
<div class="canvas" id="tile-big-read">
  <div class="canvas__spill"></div>
  <div class="canvas__grain"></div>

  <div class="masthead">
    <div class="masthead__program">Free to be Faithful</div>
    <div class="masthead__org">Institute for Christian Studies</div>
  </div>

  <div class="book">
    <img class="book__img" src="cover-defying-tyrants.jpg" alt="Defying Tyrants by Matthew D. Taylor">
  </div>

  <div class="bill">
    <div class="bill__meta">Fall Big Read &middot; 2026</div>
    <div class="bill__rule"></div>
    <h1 class="bill__title">Defying<br>Tyrants</h1>
    <p class="bill__subtitle">Following Jesus in a World of Christian Antichrists</p>
  </div>

  <div class="byline">
    <div class="byline__face"><img src="../assets/img/MatthewDTaylor.webp" alt="Matthew D. Taylor"></div>
    <div>
      <div class="byline__with">An evening with</div>
      <div class="byline__name">Matthew D. Taylor</div>
      <div class="byline__role">Scholar of Christian extremism</div>
    </div>
  </div>

  <div class="when">
    <div class="when__date">Thursday, October 8</div>
    <div class="when__time">7:00 PM ET &middot; Online</div>
    <div class="when__free">Free</div>
  </div>

  <div class="band">
    <div class="band__call">Register &middot; f2bf.icscanada.edu/big-read</div>
    <img class="band__mark" src="../assets/img/ICS+logo+white-01.png" alt="Institute for Christian Studies">
  </div>
</div>

</body></html>
