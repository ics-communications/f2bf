<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<title>Free to be Faithful Poster (Alt)</title>
<meta name="description" content="Print-ready 8.5×11 office-printer poster for Free to be Faithful, alternate version in the style of the 11×17 poster (index-v2.html), with a QR code to f2bf.icscanada.edu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   FREE TO BE FAITHFUL — 8.5×11 office-printer poster, ALT
   Letter-size translation of the 11×17 poster (index-v2.html):
   full-panel sanctuary photo fading into deep teal, everything
   anchored bottom-left, QR in a cream tile bottom-right.
   Sheet: US Letter. No bleed — artwork sits inside a 0.3in paper
   margin so any desktop/office printer reproduces it whole.
   ════════════════════════════════════════════════════════════════ */

:root {
  --teal-deep:   #0F2631;
  --teal-mid:    #25516A;
  --red:         #C83C2C;
  --slate-light: #D6DDE2;
  --cream:       #F0EBE3;

  --display: 'Playfair Display', Georgia, serif;
  --text:    'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;

  --margin: 0.3in;   /* paper border */
  --safe:   0.4in;   /* inner gutter of the artwork */
}

@page { size: 8.5in 11in; margin: 0; }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: #cfd6db;
  font-family: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.stage { display: flex; justify-content: center; padding: 0.5in 0; }

.sheet {
  width: 8.5in; height: 11in;
  padding: var(--margin);
  background: #fff;
  box-shadow: 0 10px 40px rgba(15, 38, 49, 0.25);
}
@media print {
  html, body { background: #fff; }
  .stage { padding: 0; }
  .sheet { box-shadow: none; }
}

.poster {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--teal-deep);
}

/* ════ Photo layer ════ */
.cover__photo {
  position: absolute; inset: 0;
  background-image: url('../assets/img/f2bf-hero-cover.jpg');
  background-size: cover;
  background-position: 45% 20%;
  opacity: 0.5;
  filter: saturate(0.5) contrast(1.05);
}
.cover__gradient {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(15,38,49,0.12) 0%,
    rgba(15,38,49,0.04) 14%,
    rgba(15,38,49,0.10) 32%,
    rgba(15,38,49,0.50) 50%,
    rgba(15,38,49,0.84) 64%,
    rgba(15,38,49,0.96) 80%,
    rgba(15,38,49,0.99) 100%);
}

/* ════ Content ════ */
.safe-area {
  position: absolute;
  inset: var(--safe);
  color: var(--cream);
  z-index: 2;
}

.eyebrow {
  position: absolute; top: 0; left: 0;
  font-size: 9pt; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(240,235,227,0.72);
}
.logo {
  position: absolute; top: -0.04in; right: 0;
  width: 0.85in; height: auto;
  opacity: 0.9;
}

.bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: flex-end;
}
.text-stack { flex: 1; min-width: 0; }

.wordmark {
  font-family: var(--display);
  font-weight: 900;
  font-size: 88pt;
  line-height: 0.88;
  letter-spacing: -0.025em;
  color: var(--cream);
}
.wordmark em {
  font-style: italic; font-weight: 400;
  color: var(--slate-light);
}

.tagline {
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: 16pt;
  color: rgba(240,235,227,0.85);
  margin-top: 0.16in;
  white-space: nowrap;
}

.manifesto {
  margin-top: 0.45in;
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: 13.5pt; line-height: 1.6;
  color: rgba(240,235,227,0.82);
}
.manifesto__rule {
  width: 28px; height: 2px;
  background: var(--red); border: 0;
  margin-top: 0.2in;
}
.pillars {
  margin-top: 0.14in;
  font-size: 8.5pt; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(240,235,227,0.7);
}
.pillars__sep { display: inline-block; margin: 0 0.1in; color: var(--red); }

/* ════ QR group ════ */
.qr-group {
  display: flex; align-items: flex-end; gap: 0.18in;
  flex-shrink: 0; margin-left: 0.3in;
}
.qr-group__text { text-align: right; padding-bottom: 0.08in; }
.qr-group__label {
  font-size: 7.5pt; font-weight: 700;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--red);
  margin-bottom: 0.06in;
}
.qr-group__url {
  font-family: var(--display); font-weight: 900;
  font-size: 14pt; letter-spacing: 0.01em;
  color: var(--cream);
}
.qr__code {
  width: 1.45in; height: 1.45in;
  background: var(--cream);
  padding: 0.06in;
  border-radius: 5px;
  box-shadow: 0 0 0 1px rgba(200,60,44,0.2), 0 4px 14px rgba(0,0,0,0.25);
  flex-shrink: 0;
}
.qr__code svg { display: block; width: 100%; height: 100%; }
.qr__code .qr__quiet { fill: var(--cream); }
.qr__code .qr__mod   { fill: var(--teal-deep); }
</style>
</head>
