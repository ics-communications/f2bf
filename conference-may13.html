  &lt;style&gt;
    html, body { margin: 0; padding: 0; background: transparent; }

    @import url(&#39;https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&amp;family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&amp;display=swap&#39;);

    .cf *, .cf *::before, .cf *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .cf {
      --teal:        #1B3A4B;
      --teal-deep:   #0F2631;
      --teal-mid:    #25516A;
      --red:         #C83C2C;
      --red-hover:   #D9503F;
      --slate:       #BCC7D0;
      --slate-light: #D6DDE2;
      --cream:       #F0EBE3;
      --cream-lt:    #F7F4EF;
      --white:       #FFFFFF;
      --ink:         #1A2A33;
      --body:        #3D4F59;
      --muted:       #7E929E;
      --faint:       rgba(27,58,75,0.08);

      --display: &#39;Playfair Display&#39;, Georgia, serif;
      --text:    &#39;Source Sans 3&#39;, &#39;Helvetica Neue&#39;, Arial, sans-serif;

      font-family: var(--text);
      color: var(--ink);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      width: 100vw !important;
      margin-left: calc(50% - 50vw) !important;
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* ─── Buttons ─── */
    .cf-btn {
      display: inline-flex; align-items: center; gap: 0.45em;
      font-family: var(--text); font-size: 0.95rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.85em 2.4em; border: none; cursor: pointer;
      text-decoration: none; border-radius: 100px;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .cf-btn--red { background: var(--red); color: var(--white); }
    .cf-btn--red:hover { background: var(--red-hover); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200,60,44,0.25); }
    .cf-btn--ghost { background: transparent; color: var(--cream); border: 1.5px solid rgba(240,235,227,0.3); }
    .cf-btn--ghost:hover { border-color: var(--cream); background: rgba(255,255,255,0.06); transform: translateY(-2px); }
    .cf-btn--teal { background: var(--teal); color: var(--white); }
    .cf-btn--teal:hover { background: var(--teal-mid); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(27,58,75,0.25); }
    .cf-btn--outline { background: transparent; color: var(--teal); border: 1.5px solid rgba(27,58,75,0.25); }
    .cf-btn--outline:hover { border-color: var(--teal); background: var(--faint); transform: translateY(-2px); }

    /* ─── Horizontal rule ─── */
    .cf-rule { max-width: 80px; height: 3px; border: none; background: var(--red); margin: 0; }
    .cf-rule--center { margin-left: auto; margin-right: auto; }
    .cf-rule--cream { background: var(--cream); opacity: 0.4; }

    /* ─── Grain overlay mixin ─── */
    .cf-grain::before {
      content: &#39;&#39;; position: absolute; inset: 0; pointer-events: none;
      background: url(&quot;data:image/svg+xml,%3Csvg viewBox=&#39;0 0 256 256&#39; xmlns=&#39;http://www.w3.org/2000/svg&#39;%3E%3Cfilter id=&#39;n&#39;%3E%3CfeTurbulence type=&#39;fractalNoise&#39; baseFrequency=&#39;0.8&#39; numOctaves=&#39;4&#39; stitchTiles=&#39;stitch&#39;/%3E%3C/filter%3E%3Crect width=&#39;100%25&#39; height=&#39;100%25&#39; filter=&#39;url(%23n)&#39; opacity=&#39;0.03&#39;/%3E%3C/svg%3E&quot;);
    }

    @keyframes cfReveal {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ════════════════════════════════════════════ */
    /* HERO                                         */
    /* ════════════════════════════════════════════ */
    .cf-hero {
      position: relative; min-height: 100vh;
      display: flex; align-items: flex-end;
      overflow: hidden; background: var(--teal-deep);
    }
    .cf-hero__bg { position: absolute; inset: 0; z-index: 0; }
    .cf-hero__bg img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.3; filter: saturate(0.15) brightness(0.5);
    }
    .cf-hero__bg::after {
      content: &#39;&#39;; position: absolute; inset: 0;
      background: url(&quot;data:image/svg+xml,%3Csvg viewBox=&#39;0 0 256 256&#39; xmlns=&#39;http://www.w3.org/2000/svg&#39;%3E%3Cfilter id=&#39;n&#39;%3E%3CfeTurbulence type=&#39;fractalNoise&#39; baseFrequency=&#39;0.85&#39; numOctaves=&#39;4&#39; stitchTiles=&#39;stitch&#39;/%3E%3C/filter%3E%3Crect width=&#39;100%25&#39; height=&#39;100%25&#39; filter=&#39;url(%23n)&#39; opacity=&#39;0.04&#39;/%3E%3C/svg%3E&quot;);
      pointer-events: none; z-index: 1;
    }
    .cf-hero__gradient {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(
        175deg,
        rgba(15,38,49,0.1) 0%,
        rgba(15,38,49,0.45) 35%,
        rgba(15,38,49,0.82) 75%,
        rgba(15,38,49,0.9) 100%
      );
    }
    .cf-hero__content {
      position: relative; z-index: 3;
      width: 100%; max-width: 1200px;
      margin: 0 auto; padding: 4rem 2.5rem 5rem;
    }
    .cf-hero__presented {
      display: flex; align-items: center;
      gap: 2rem; flex-wrap: wrap;
      margin-bottom: 2.2rem;
      animation: cfReveal 1s ease-out 0.15s both;
    }
    .cf-hero__org-block {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    }
    .cf-hero__org-logo {
      height: 50px; width: auto;
    }
    .cf-hero__org {
      font-family: var(--text); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: rgba(240,235,227,0.5);
    }
    .cf-hero__org-sep {
      width: 1px; height: 36px; background: rgba(240,235,227,0.2);
    }
    .cf-hero__title {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 0.95; letter-spacing: -0.02em;
      color: var(--cream);
      margin-bottom: 0.8rem;
      animation: cfReveal 1s ease-out 0.3s both;
    }
    .cf-hero__title em {
      font-style: italic; font-weight: 400;
      color: var(--slate-light);
    }
    .cf-hero__subtitle {
      font-family: var(--display); font-style: italic;
      font-size: clamp(1.1rem, 2.5vw, 1.55rem);
      color: rgba(188,199,208,0.55); line-height: 1.45;
      max-width: 620px; margin-bottom: 2.5rem;
      animation: cfReveal 1s ease-out 0.45s both;
    }
    .cf-hero__meta {
      display: flex; flex-wrap: wrap; gap: 0.6rem;
      margin-bottom: 2.8rem;
      animation: cfReveal 1s ease-out 0.55s both;
    }
    .cf-hero__meta-item {
      font-family: var(--text); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.45em 1em; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.12); color: var(--muted);
    }
    .cf-hero__actions {
      display: flex; gap: 1rem; flex-wrap: wrap;
      animation: cfReveal 1s ease-out 0.7s both;
    }
    .cf-hero__verse {
      position: absolute; bottom: 5rem; right: 2.5rem;
      max-width: 300px; text-align: right;
      animation: cfReveal 1s ease-out 0.85s both;
    }
    .cf-hero__verse-text {
      font-family: var(--display); font-style: italic;
      font-size: 0.95rem; color: rgba(240,235,227,0.25);
      line-height: 1.65; margin-bottom: 0.4rem;
    }
    .cf-hero__verse-ref {
      font-family: var(--text); font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(240,235,227,0.15);
    }
    @media (max-width: 768px) {
      .cf-hero { align-items: center; min-height: 92vh; }
      .cf-hero__verse { position: static; text-align: left; max-width: 100%; margin-top: 2.5rem; }
    }

    /* ════════════════════════════════════════════ */
    /* ABOUT                                        */
    /* ════════════════════════════════════════════ */
    .cf-about {
      background: var(--cream-lt); padding: 6rem 2.5rem;
    }
    .cf-about__inner {
      max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr; gap: 2rem;
    }
    @media (min-width: 800px) {
      .cf-about__inner { grid-template-columns: 1fr 1.5fr; gap: 5rem; align-items: start; }
    }
    .cf-about__label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--red); margin-bottom: 1rem;
    }
    .cf-about__heading {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1; color: var(--teal);
      margin-bottom: 1.2rem;
    }
    .cf-about__body {
      font-family: var(--text); font-size: 1.12rem;
      color: var(--body); line-height: 1.9;
      margin-bottom: 1.5rem;
    }
    .cf-about__body strong { color: var(--teal); font-weight: 600; }
    .cf-about__themes {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 500px) {
      .cf-about__themes { grid-template-columns: 1fr; }
    }
    .cf-about__theme {
      font-family: var(--text); font-size: 0.88rem;
      color: var(--body); line-height: 1.55;
      padding-left: 1.2rem; position: relative;
    }
    .cf-about__theme::before {
      content: &#39;→&#39;; position: absolute; left: 0;
      color: var(--red); font-size: 0.82rem;
    }

    /* ════════════════════════════════════════════ */
    /* SPEAKERS                                     */
    /* ════════════════════════════════════════════ */
    .cf-speakers {
      background: var(--teal); padding: 5.5rem 2.5rem;
      position: relative;
    }
    .cf-speakers::before {
      content: &#39;&#39;; position: absolute; inset: 0; pointer-events: none;
      background: url(&quot;data:image/svg+xml,%3Csvg viewBox=&#39;0 0 256 256&#39; xmlns=&#39;http://www.w3.org/2000/svg&#39;%3E%3Cfilter id=&#39;n&#39;%3E%3CfeTurbulence type=&#39;fractalNoise&#39; baseFrequency=&#39;0.8&#39; numOctaves=&#39;4&#39; stitchTiles=&#39;stitch&#39;/%3E%3C/filter%3E%3Crect width=&#39;100%25&#39; height=&#39;100%25&#39; filter=&#39;url(%23n)&#39; opacity=&#39;0.03&#39;/%3E%3C/svg%3E&quot;);
    }
    .cf-speakers__inner {
      max-width: 1200px; margin: 0 auto; position: relative; z-index: 1;
    }
    .cf-speakers__label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--red); margin-bottom: 1rem;
    }
    .cf-speakers__heading {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1; color: var(--cream); margin-bottom: 3.5rem;
    }
    .cf-speakers__grid {
      display: grid; grid-template-columns: 1fr; gap: 3rem;
    }
    @media (min-width: 750px) {
      .cf-speakers__grid { grid-template-columns: 1fr 1fr; gap: 3rem; }
    }
    .cf-speaker {
      display: grid; grid-template-columns: 1fr; gap: 0;
      background: rgba(255,255,255,0.03); border-radius: 8px;
      overflow: hidden; border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .cf-speaker:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    }
    .cf-speaker__img {
      width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
      filter: saturate(0.7) brightness(0.9);
      display: block;
    }
    .cf-speaker__img--second {
      object-position: 20% 20%;
    }
    .cf-speaker__body { padding: 2rem 1.8rem 2.2rem; }
    .cf-speaker__role {
      font-family: var(--text); font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 0.35em 0.9em; border-radius: 100px;
      background: var(--red); color: var(--white);
      display: inline-block; margin-bottom: 1rem;
    }
    .cf-speaker__name {
      font-family: var(--display); font-weight: 700;
      font-size: 1.5rem; color: var(--cream); line-height: 1.25;
      margin-bottom: 0.8rem;
    }
    .cf-speaker__bio {
      font-family: var(--text); font-size: 0.94rem;
      color: var(--muted); line-height: 1.75;
    }
    .cf-speaker__bio em { font-style: italic; color: rgba(240,235,227,0.5); }

    /* ════════════════════════════════════════════ */
    /* SCHEDULE                                     */
    /* ════════════════════════════════════════════ */
    .cf-schedule {
      background: var(--cream-lt); padding: 5.5rem 2.5rem;
    }
    .cf-schedule__inner { max-width: 900px; margin: 0 auto; }
    .cf-schedule__label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--red); margin-bottom: 1rem;
    }
    .cf-schedule__heading {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--teal); line-height: 1.1; margin-bottom: 3rem;
    }
    .cf-schedule__day {
      margin-bottom: 3rem;
    }
    .cf-schedule__day:last-child { margin-bottom: 0; }
    .cf-schedule__day-header {
      display: flex; align-items: baseline; gap: 1rem;
      flex-wrap: wrap; margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--teal);
    }
    .cf-schedule__day-name {
      font-family: var(--display); font-weight: 700;
      font-size: 1.35rem; color: var(--teal);
    }
    .cf-schedule__day-venue {
      font-family: var(--text); font-size: 0.85rem;
      color: var(--muted); font-weight: 400;
    }
    .cf-schedule__items {
      display: flex; flex-direction: column; gap: 0;
    }
    .cf-schedule__item {
      display: grid; grid-template-columns: 140px 1fr; gap: 1.5rem;
      padding: 1.2rem 0;
      border-top: 1px solid rgba(27,58,75,0.08);
      align-items: baseline;
    }
    @media (max-width: 550px) {
      .cf-schedule__item { grid-template-columns: 1fr; gap: 0.3rem; }
    }
    .cf-schedule__item:last-child { border-bottom: 1px solid rgba(27,58,75,0.08); }
    .cf-schedule__time {
      font-family: var(--text); font-size: 0.85rem; font-weight: 600;
      color: var(--teal); letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .cf-schedule__event-title {
      font-family: var(--display); font-weight: 600;
      font-size: 1.05rem; color: var(--ink); line-height: 1.4;
    }
    .cf-schedule__event-note {
      font-family: var(--text); font-size: 0.88rem;
      color: var(--muted); line-height: 1.55; margin-top: 0.15rem;
    }
    .cf-schedule__item--break .cf-schedule__event-title {
      font-family: var(--text); font-weight: 400;
      font-style: italic; color: var(--muted); font-size: 0.92rem;
    }

    /* ════════════════════════════════════════════ */
    /* SESSIONS — workshop &amp; roundtable details     */
    /* ════════════════════════════════════════════ */
    .cf-sessions {
      background: var(--teal-deep); padding: 5.5rem 2.5rem;
      position: relative;
    }
    .cf-sessions::before {
      content: &#39;&#39;; position: absolute; inset: 0; pointer-events: none;
      background: url(&quot;data:image/svg+xml,%3Csvg viewBox=&#39;0 0 256 256&#39; xmlns=&#39;http://www.w3.org/2000/svg&#39;%3E%3Cfilter id=&#39;n&#39;%3E%3CfeTurbulence type=&#39;fractalNoise&#39; baseFrequency=&#39;0.8&#39; numOctaves=&#39;4&#39; stitchTiles=&#39;stitch&#39;/%3E%3C/filter%3E%3Crect width=&#39;100%25&#39; height=&#39;100%25&#39; filter=&#39;url(%23n)&#39; opacity=&#39;0.03&#39;/%3E%3C/svg%3E&quot;);
    }
    .cf-sessions__inner {
      max-width: 1200px; margin: 0 auto; position: relative; z-index: 1;
    }
    .cf-sessions__label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--red); margin-bottom: 1rem;
    }
    .cf-sessions__heading {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--cream); line-height: 1.1; margin-bottom: 1.2rem;
    }
    .cf-sessions__subhead {
      font-family: var(--text); font-size: 1.05rem;
      color: rgba(240,235,227,0.45); line-height: 1.8;
      max-width: 600px; margin-bottom: 3.5rem;
    }

    .cf-sessions__block { margin-bottom: 3rem; }
    .cf-sessions__block:last-child { margin-bottom: 0; }
    .cf-sessions__block-label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--red); margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .cf-sessions__cards {
      display: grid; grid-template-columns: 1fr; gap: 1.5rem;
    }
    @media (min-width: 700px) {
      .cf-sessions__cards { grid-template-columns: 1fr 1fr; }
    }
    .cf-session {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; padding: 2rem 1.8rem;
      transition: background 0.35s ease;
    }
    .cf-session:hover { background: rgba(255,255,255,0.07); }
    .cf-session__track {
      font-family: var(--text); font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 0.3em 0.75em; border-radius: 100px;
      display: inline-block; margin-bottom: 1rem;
    }
    .cf-session__track--pastoral {
      background: rgba(200,60,44,0.15); color: var(--red-hover);
    }
    .cf-session__track--community {
      background: rgba(37,81,106,0.3); color: var(--slate-light);
    }
    .cf-session__title {
      font-family: var(--display); font-weight: 700;
      font-size: 1.2rem; color: var(--cream); line-height: 1.3;
      margin-bottom: 0.8rem;
    }
    .cf-session__desc {
      font-family: var(--text); font-size: 0.92rem;
      color: var(--muted); line-height: 1.75;
    }
    .cf-session__facilitator {
      font-family: var(--text); font-size: 0.8rem; font-weight: 600;
      color: rgba(240,235,227,0.35); margin-top: 0.8rem;
      font-style: italic;
    }

    /* ════════════════════════════════════════════ */
    /* CLOSING PANEL — featured callout              */
    /* ════════════════════════════════════════════ */
    .cf-panel {
      background: var(--slate); padding: 5.5rem 2.5rem;
    }
    .cf-panel__inner {
      max-width: 900px; margin: 0 auto;
    }
    .cf-panel__label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--red); margin-bottom: 1rem;
    }
    .cf-panel__heading {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      color: var(--teal); line-height: 1.12; margin-bottom: 1.5rem;
    }
    .cf-panel__body {
      font-family: var(--text); font-size: 1.1rem;
      color: var(--body); line-height: 1.85; margin-bottom: 1.5rem;
    }
    .cf-panel__questions {
      border-left: 3px solid var(--red);
      padding-left: 1.5rem; margin-top: 2rem;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .cf-panel__q {
      font-family: var(--display); font-style: italic; font-weight: 400;
      font-size: 1.12rem; color: var(--teal); line-height: 1.5;
    }

    /* ════════════════════════════════════════════ */
    /* AT A GLANCE — info bar                        */
    /* ════════════════════════════════════════════ */
    .cf-glance {
      background: var(--cream-lt); padding: 4.5rem 2.5rem;
    }
    .cf-glance__inner { max-width: 1200px; margin: 0 auto; }
    .cf-glance__label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--red); margin-bottom: 2.5rem;
    }
    .cf-glance__bar {
      display: grid; grid-template-columns: 1fr; gap: 0;
      border-top: 1px solid rgba(27,58,75,0.1);
      border-bottom: 1px solid rgba(27,58,75,0.1);
    }
    @media (min-width: 600px) { .cf-glance__bar { grid-template-columns: 1fr 1fr 1fr 1fr; } }
    .cf-glance__cell {
      padding: 1.8rem 1.5rem;
      border-bottom: 1px solid rgba(27,58,75,0.06);
    }
    @media (min-width: 600px) {
      .cf-glance__cell { border-bottom: none; border-right: 1px solid rgba(27,58,75,0.06); }
      .cf-glance__cell:last-child { border-right: none; }
    }
    .cf-glance__cell-label {
      font-family: var(--text); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.4rem;
    }
    .cf-glance__cell-value {
      font-family: var(--display); font-weight: 700;
      font-size: 1.35rem; color: var(--teal); line-height: 1.3;
    }
    .cf-glance__cell-note {
      font-family: var(--text); font-size: 0.85rem;
      color: var(--muted); margin-top: 0.2rem;
    }

    /* ════════════════════════════════════════════ */
    /* CTA                                          */
    /* ════════════════════════════════════════════ */
    .cf-cta {
      background: var(--teal); padding: 5.5rem 2.5rem;
      position: relative;
    }
    .cf-cta::before {
      content: &#39;&#39;; position: absolute; inset: 0; pointer-events: none;
      background: url(&quot;data:image/svg+xml,%3Csvg viewBox=&#39;0 0 256 256&#39; xmlns=&#39;http://www.w3.org/2000/svg&#39;%3E%3Cfilter id=&#39;n&#39;%3E%3CfeTurbulence type=&#39;fractalNoise&#39; baseFrequency=&#39;0.8&#39; numOctaves=&#39;4&#39; stitchTiles=&#39;stitch&#39;/%3E%3C/filter%3E%3Crect width=&#39;100%25&#39; height=&#39;100%25&#39; filter=&#39;url(%23n)&#39; opacity=&#39;0.03&#39;/%3E%3C/svg%3E&quot;);
    }
    .cf-cta__inner {
      max-width: 700px; margin: 0 auto; text-align: center;
      position: relative; z-index: 1;
    }
    .cf-cta__heading {
      font-family: var(--display); font-weight: 900;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--cream); line-height: 1.1; margin-bottom: 1.2rem;
    }
    .cf-cta__text {
      font-family: var(--text); font-size: 1.1rem;
      color: rgba(240,235,227,0.5); line-height: 1.85; margin-bottom: 1rem;
    }
    .cf-cta__details {
      display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
      margin-bottom: 2.5rem;
    }
    .cf-cta__detail {
      font-family: var(--text); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.4em 0.9em; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.12); color: var(--muted);
    }
    .cf-cta__actions {
      display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
    }
    .cf-cta__note {
      font-family: var(--text); font-size: 0.85rem;
      color: rgba(240,235,227,0.3); margin-top: 1.8rem;
      font-style: italic;
    }

    /* ════════════════════════════════════════════ */
    /* REGISTRATION MODAL                            */
    /* ════════════════════════════════════════════ */
    .cf-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(15,38,49,0.65); backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
      padding: 1.5rem; opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cf-modal-overlay.is-active { display: flex; }
    .cf-modal-overlay.is-visible { opacity: 1; }

    .cf-modal {
      background: var(--white); border-radius: 14px;
      width: 100%; max-width: 620px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 40px 80px rgba(15,38,49,0.3);
      transform: translateY(24px) scale(0.97);
      transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
      position: relative;
    }
    .cf-modal-overlay.is-visible .cf-modal {
      transform: translateY(0) scale(1);
    }

    .cf-modal__close {
      position: absolute; top: 1.2rem; right: 1.2rem;
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: var(--faint); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); transition: all 0.2s;
      z-index: 2;
    }
    .cf-modal__close:hover { background: var(--teal); color: var(--white); }
    .cf-modal__close svg { width: 16px; height: 16px; }

    .cf-modal__header { padding: 2.5rem 2.5rem 0; }
    .cf-modal__tag {
      font-family: var(--text); font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--red); margin-bottom: 0.6rem;
    }
    .cf-modal__title {
      font-family: var(--display); font-weight: 900;
      font-size: 1.6rem; line-height: 1.15;
      color: var(--teal); margin-bottom: 0.4rem;
    }
    .cf-modal__subtitle {
      font-family: var(--text); font-size: 0.92rem;
      color: var(--muted); line-height: 1.6;
      margin-bottom: 0.3rem;
    }
    .cf-modal__price-badge {
      display: inline-block; margin-top: 0.6rem;
      font-family: var(--text); font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 0.4em 1em; border-radius: 100px;
      background: var(--teal); color: var(--white);
      transition: background 0.2s;
    }

    .cf-modal__body { padding: 1.8rem 2.5rem 2.5rem; }

    .cf-modal__row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
      margin-bottom: 1rem;
    }
    .cf-modal__row--full { grid-template-columns: 1fr; }
    @media (max-width: 520px) {
      .cf-modal__row { grid-template-columns: 1fr; }
    }

    .cf-modal__field { display: flex; flex-direction: column; gap: 0.35rem; }
    .cf-modal__label {
      font-family: var(--text); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--teal);
    }
    .cf-modal__label span { color: var(--red); }
    .cf-modal__input,
    .cf-modal__select,
    .cf-modal__textarea {
      font-family: var(--text); font-size: 0.95rem;
      color: var(--ink); padding: 0.75em 1em;
      border: 1.5px solid var(--slate-light);
      border-radius: 8px; background: var(--cream-lt);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .cf-modal__select { cursor: pointer; appearance: auto; }
    .cf-modal__textarea { resize: vertical; min-height: 70px; }
    .cf-modal__input:focus,
    .cf-modal__select:focus,
    .cf-modal__textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(27,58,75,0.08);
    }
    .cf-modal__input.is-invalid,
    .cf-modal__select.is-invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(200,60,44,0.1);
    }

    .cf-modal__divider {
      height: 1px; background: var(--slate-light);
      margin: 1.6rem 0 1.2rem; border: none;
    }

    .cf-modal__pay-label {
      font-family: var(--text); font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem;
      text-align: center;
    }

    #cf-paypal-container {
      min-height: 55px;
      display: flex; align-items: center; justify-content: center;
    }
    #cf-paypal-container .cf-paypal-loading {
      font-family: var(--text); font-size: 0.85rem;
      color: var(--muted); font-style: italic;
    }

    .cf-modal__note {
      font-family: var(--text); font-size: 0.78rem;
      color: var(--muted); text-align: center;
      margin-top: 1rem; line-height: 1.55;
    }
    .cf-modal__note a { color: var(--teal); text-decoration: underline; }

    .cf-modal__livestream-note {
      display: none;
      font-family: var(--text); font-size: 0.85rem;
      color: var(--teal); background: rgba(27,58,75,0.06);
      border: 1px solid rgba(27,58,75,0.12);
      border-radius: 8px; padding: 0.8em 1.2em;
      margin-top: 0.5rem; line-height: 1.55;
    }
    .cf-modal__livestream-note.is-active { display: block; }

    /* Confirmation state */
    .cf-modal__confirm {
      display: none; text-align: center;
      padding: 3.5rem 2.5rem;
    }
    .cf-modal__confirm.is-active { display: block; }
    .cf-modal__confirm-icon {
      width: 64px; height: 64px; margin: 0 auto 1.5rem;
      border-radius: 50%; background: rgba(27,58,75,0.06);
      display: flex; align-items: center; justify-content: center;
      color: var(--teal);
    }
    .cf-modal__confirm-icon svg { width: 32px; height: 32px; }
    .cf-modal__confirm h3 {
      font-family: var(--display); font-weight: 900;
      font-size: 1.5rem; color: var(--teal);
      margin-bottom: 0.8rem;
    }
    .cf-modal__confirm p {
      font-family: var(--text); font-size: 1rem;
      color: var(--body); line-height: 1.7;
      max-width: 420px; margin: 0 auto;
    }
    .cf-modal__confirm-livestream {
      display: none;
      font-family: var(--text); font-size: 0.92rem;
      color: var(--teal); background: rgba(27,58,75,0.06);
      border: 1px solid rgba(27,58,75,0.12);
      border-radius: 8px; padding: 1em 1.4em;
      margin: 1rem auto 0; max-width: 420px; line-height: 1.6;
    }
    .cf-modal__confirm-livestream.is-active { display: block; }

    /* Error state */
    .cf-modal__error {
      display: none; font-family: var(--text);
      font-size: 0.85rem; color: var(--red);
      background: rgba(200,60,44,0.06);
      border: 1px solid rgba(200,60,44,0.15);
      border-radius: 8px; padding: 0.8em 1.2em;
      margin-bottom: 1rem; text-align: center;
    }
    .cf-modal__error.is-active { display: block; }

    /* ─── Additional Gift ─── */
    .cf-modal__gift { margin-top: 0.3rem; }
    .cf-modal__gift-heading {
      font-family: var(--text); font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--teal); margin-bottom: 0.6rem;
    }
    .cf-modal__gift-sub {
      font-family: var(--text); font-size: 0.88rem;
      color: var(--body); line-height: 1.55; margin-bottom: 1rem;
    }
    .cf-modal__gift-options {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .cf-modal__gift-chip {
      font-family: var(--text); font-size: 0.88rem; font-weight: 600;
      padding: 0.55em 1.2em; border-radius: 100px;
      border: 1.5px solid var(--slate-light); background: var(--white);
      color: var(--teal); cursor: pointer;
      transition: all 0.2s ease;
    }
    .cf-modal__gift-chip:hover {
      border-color: var(--teal); background: var(--faint);
    }
    .cf-modal__gift-chip.is-selected {
      border-color: var(--teal); background: var(--teal); color: var(--white);
    }
    .cf-modal__gift-custom {
      display: none; margin-top: 0.5rem;
    }
    .cf-modal__gift-custom.is-active { display: flex; }
    .cf-modal__gift-custom-wrap {
      position: relative; flex: 1; max-width: 180px;
    }
    .cf-modal__gift-custom-wrap::before {
      content: &#39;$&#39;; position: absolute;
      left: 1em; top: 50%; transform: translateY(-50%);
      font-family: var(--text); font-size: 0.95rem;
      font-weight: 600; color: var(--muted);
      pointer-events: none;
    }
    .cf-modal__gift-custom input {
      font-family: var(--text); font-size: 0.95rem;
      color: var(--ink); padding: 0.65em 1em 0.65em 1.8em;
      border: 1.5px solid var(--slate-light);
      border-radius: 8px; background: var(--cream-lt);
      outline: none; width: 100%;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .cf-modal__gift-custom input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(27,58,75,0.08);
    }
    .cf-modal__gift-total {
      display: none;
      font-family: var(--text); font-size: 0.85rem; font-weight: 600;
      color: var(--teal); background: rgba(27,58,75,0.05);
      border-radius: 8px; padding: 0.7em 1em; margin-top: 0.8rem;
      text-align: center;
    }
    .cf-modal__gift-total.is-active { display: block; }
    .cf-modal__gift-receipt {
      font-family: var(--text); font-size: 0.82rem;
      color: var(--body); line-height: 1.65;
      margin-top: 0.8rem; padding: 0.9em 1.1em;
      background: rgba(200,60,44,0.04);
      border: 1px solid rgba(200,60,44,0.12);
      border-radius: 8px;
    }
    .cf-modal__gift-receipt strong {
      color: var(--teal); font-weight: 700;
    }
    .cf-modal__gift-receipt a {
      color: var(--red); font-weight: 600; text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ─── Modal mobile overrides ─── */
    @media (max-width: 767px) {
      .cf-modal__header { padding: 2rem 1.5rem 0; }
      .cf-modal__body { padding: 1.5rem; }
      .cf-modal__title { font-size: 1.35rem; }
      .cf-modal__confirm { padding: 2.5rem 1.5rem; }
    }
  &lt;/style&gt;
&lt;/head&gt;

&lt;!-- ===== F2BF NAVIGATION BAR ===== --&gt;
&lt;style&gt;
  /* ===== SQUARESPACE OVERRIDES ===== */
  .sqs-block-code { padding: 0 !important; }
  .sqs-block-code .sqs-block-content { margin: 0 !important; }

  /* ===== RESET FOR NAV SCOPE ===== */
  .f2bf-header *,
  .f2bf-header *::before,
  .f2bf-header *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* ===== NAV BAR ===== */
  .f2bf-header {
    background: #1B3A4B;
    width: 100vw !important;
    margin-left: calc(50% - 50vw) !important;
    max-width: 100vw;
    position: relative;
    z-index: 1000;
    -webkit-font-smoothing: antialiased;
  }

  .f2bf-header__inner {
    max-width: 100%;
    margin: 0 auto;
    padding: 0 10vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 100px;
  }

  /* ===== LOGO ===== */
  .f2bf-header__logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
  }

  .f2bf-header__logo-img {
    height: 53px;
    width: auto;
    display: block;
  }

  /* ===== DESKTOP NAV ===== */
  .f2bf-nav {
    display: flex;
    align-items: center;
    gap: 0;
    list-style: none;
  }

  .f2bf-nav__item {
    position: relative;
  }

  .f2bf-nav__link {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 0.9vw 16px;
    font-family: &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #F5F5EF;
    text-decoration: none;
    transition: color 0.2s ease;
    white-space: nowrap;
    cursor: pointer;
    background: none;
    border: none;
  }

  .f2bf-nav__link:hover {
    color: #F5F5EF;
    text-decoration: underline;
    text-underline-offset: 6px;
    text-decoration-thickness: 1.5px;
  }

  .f2bf-nav__item--active .f2bf-nav__link {
    text-decoration: underline;
    text-underline-offset: 6px;
    text-decoration-thickness: 1.5px;
  }

  /* Dropdown caret */
  .f2bf-nav__caret {
    display: inline-block;
    width: 0;
    height: 0;
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
    border-top: 4px solid rgba(255, 255, 255, 0.55);
    margin-left: 2px;
    margin-top: 1px;
    transition: border-top-color 0.2s ease;
  }

  .f2bf-nav__item:hover .f2bf-nav__caret {
    border-top-color: rgba(255, 255, 255, 0.9);
  }

  /* ===== DROPDOWN PANELS ===== */
  .f2bf-dropdown {
    position: absolute;
    top: 100%;
    right: 0;
    min-width: 240px;
    background: #1B3A4B;
    padding: 2px 0 6px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    z-index: 200;
  }

  .f2bf-nav__item:hover .f2bf-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .f2bf-dropdown__link {
    display: block;
    padding: 2px 20px;
    font-family: &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: right;
    color: #F5F5EF;
    text-decoration: none;
  }

  .f2bf-dropdown__link:hover {
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1.5px;
  }

  /* ===== MOBILE BURGER ===== */
  .f2bf-burger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .f2bf-burger span {
    display: block;
    height: 1px;
    background: rgba(255, 255, 255, 0.85);
    transition: all 0.3s ease;
  }

  .f2bf-burger span:first-child {
    width: 50%;
    margin-left: auto;
  }

  .f2bf-burger span:nth-child(2) {
    width: 100%;
  }

  .f2bf-burger span:last-child {
    width: 75%;
    margin-left: auto;
  }

  /* ===== MOBILE OVERLAY ===== */
  .f2bf-mobile-menu {
    display: none;
    position: fixed;
    inset: 0;
    background: #1B3A4B;
    z-index: 999;
    padding: 100px 2rem 2rem;
    flex-direction: column;
    gap: 0;
    overflow-y: auto;
  }

  .f2bf-mobile-menu.is-open {
    display: flex;
  }

  .f2bf-mobile-menu__close {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.7);
    font-size: 1.8rem;
    cursor: pointer;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .f2bf-mobile-menu__link {
    display: block;
    padding: 14px 0;
    font-family: &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #F5F5EF;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .f2bf-mobile-menu__sub {
    padding-left: 1.2rem;
  }

  .f2bf-mobile-menu__sub a {
    display: block;
    padding: 10px 0;
    font-family: &#39;Helvetica Neue&#39;, Helvetica, Arial, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    color: rgba(245, 245, 239, 0.6);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .f2bf-mobile-menu__sub a:hover {
    color: #F5F5EF;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1060px) {
    .f2bf-nav { display: none; }
    .f2bf-burger { display: flex; }
    .f2bf-header__inner {
      padding: 0 6vw;
      min-height: 69px;
    }
    .f2bf-header__logo-img {
      height: 30px;
    }
  }

  @media (min-width: 1061px) {
    .f2bf-mobile-menu { display: none !important; }
  }
&lt;/style&gt;

  &lt;!-- ══════ HERO ══════ --&gt;

          &lt;span class=&quot;cf-hero__org&quot;&gt;Knox College Ministry Forum&lt;/span&gt;

          &lt;span class=&quot;cf-hero__org&quot;&gt;ICS Free to be Faithful&lt;/span&gt;

      &lt;h1 class=&quot;cf-hero__title&quot;&gt;Courageous&lt;br&gt;Faith &lt;em&gt;in a Time&lt;/em&gt;&lt;br&gt;&lt;em&gt;of&lt;/em&gt; Fear&lt;/h1&gt;

        &lt;span class=&quot;cf-hero__meta-item&quot;&gt;May 13–14, 2026&lt;/span&gt;

  &lt;section class=&quot;cf-about&quot;&gt;

      &lt;div&gt;
        &lt;p class=&quot;cf-about__label&quot;&gt;About the Conference&lt;/p&gt;
        &lt;h2 class=&quot;cf-about__heading&quot;&gt;From Fear&lt;br&gt;Toward Hope&lt;/h2&gt;
        &lt;hr class=&quot;cf-rule&quot;&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;p class=&quot;cf-about__body&quot;&gt;&lt;strong&gt;Courageous Faith in a Time of Fear&lt;/strong&gt; is a two-day public conference exploring what it means to lead, speak, and act faithfully amid political polarization and deep divisions within churches.&lt;/p&gt;
        &lt;p class=&quot;cf-about__body&quot;&gt;Presented by Knox College&#39;s &lt;strong&gt;Ministry Forum&lt;/strong&gt; and the Institute for Christian Studies&#39; &lt;strong&gt;Free to Be Faithful&lt;/strong&gt; initiative, the conference is open to clergy and lay leaders alike and includes a dedicated pastoral leadership track.&lt;/p&gt;
        &lt;p class=&quot;cf-about__body&quot;&gt;Through roundtables, workshops, and a closing panel, participants will explore sustaining big-tent communities, organizing for faithful action, and building the capacity of faith communities to move from fear to hope.&lt;/p&gt;

          &lt;span class=&quot;cf-about__theme&quot;&gt;Truth-telling, reconciliation &amp;amp; moral imagination&lt;/span&gt;
          &lt;span class=&quot;cf-about__theme&quot;&gt;Cultivating resilient, hopeful communities&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ══════ SPEAKERS ══════ --&gt;

      &lt;div class=&quot;cf-speakers__grid&quot;&gt;

        &lt;div class=&quot;cf-speaker&quot;&gt;
          &lt;!-- PLACEHOLDER: Replace with photo of Kristin Kobes Du Mez --&gt;
          &lt;img class=&quot;cf-speaker__img&quot; src=&quot;https://lightroom.adobe.com/v2c/spaces/8e293c41299846de9eaf08c99ce6ee2a/assets/59ce09f32a58fc316e527bcac3ad7d8a/revisions/7b6e0c0d080a8cca9fab99b0995a2faa/renditions/9ede31d929031de67041121df4df02a4&quot; alt=&quot;Dr. Kristin Kobes Du Mez&quot;&gt;
          &lt;div class=&quot;cf-speaker__body&quot;&gt;

  &lt;!-- ══════ SESSIONS ══════ --&gt;
  &lt;section class=&quot;cf-sessions&quot;&gt;
    &lt;div class=&quot;cf-sessions__inner&quot;&gt;
      &lt;p class=&quot;cf-sessions__label&quot;&gt;Roundtables &amp;amp; Workshops&lt;/p&gt;
      &lt;h2 class=&quot;cf-sessions__heading&quot;&gt;Session Details&lt;/h2&gt;
      &lt;p class=&quot;cf-sessions__subhead&quot;&gt;Each time block offers concurrent tracks for pastoral leaders and community members. Choose the sessions that speak to where you are.&lt;/p&gt;

      &lt;!-- Roundtables --&gt;
      &lt;div class=&quot;cf-sessions__block&quot;&gt;
        &lt;div class=&quot;cf-sessions__block-label&quot;&gt;Roundtable Discussions — 10:30 AM – 12:00 PM&lt;/div&gt;
        &lt;div class=&quot;cf-sessions__cards&quot;&gt;
          &lt;div class=&quot;cf-session&quot;&gt;
            &lt;span class=&quot;cf-session__track cf-session__track--pastoral&quot;&gt;Pastoral Track&lt;/span&gt;
            &lt;h3 class=&quot;cf-session__title&quot;&gt;Reformed Witness in the 21st Century: Journeying Together in Courage&lt;/h3&gt;
            &lt;p class=&quot;cf-session__desc&quot;&gt;An honest conversation about the challenges and possibilities facing Reformed communities today. Reflect on leading congregations through ideological tension, denominational transition, and public scrutiny.&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cf-session&quot;&gt;
            &lt;span class=&quot;cf-session__track cf-session__track--community&quot;&gt;Community Track&lt;/span&gt;
            &lt;h3 class=&quot;cf-session__title&quot;&gt;Taking a Stand Without Tearing the Church Apart&lt;/h3&gt;
            &lt;p class=&quot;cf-session__desc&quot;&gt;How do we act courageously without deepening division? Explore what faithful public responsibility looks like for congregations and how members can support clergy and one another through difficult conversations.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- Workshops I --&gt;
      &lt;div class=&quot;cf-sessions__block&quot;&gt;
        &lt;div class=&quot;cf-sessions__block-label&quot;&gt;Workshops Session I — 1:00 – 2:15 PM&lt;/div&gt;
        &lt;div class=&quot;cf-sessions__cards&quot;&gt;
          &lt;div class=&quot;cf-session&quot;&gt;
            &lt;span class=&quot;cf-session__track cf-session__track--pastoral&quot;&gt;Pastoral Track&lt;/span&gt;
            &lt;h3 class=&quot;cf-session__title&quot;&gt;When Silence Feels Safer: The Risk and Responsibility of Speaking&lt;/h3&gt;
            &lt;p class=&quot;cf-session__desc&quot;&gt;Explore how to discern when and how to speak with courage, how to prepare congregations for difficult conversations, and how to remain rooted in vocation rather than reaction.&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cf-session&quot;&gt;
            &lt;span class=&quot;cf-session__track cf-session__track--community&quot;&gt;Community Track&lt;/span&gt;
            &lt;h3 class=&quot;cf-session__title&quot;&gt;From Private Concern to Collective Action&lt;/h3&gt;
            &lt;p class=&quot;cf-session__desc&quot;&gt;Courage is both personal &lt;i&gt;and&lt;/i&gt; communal. Focus on how congregations can move 
to faithful action, create alternative spaces of support, and sustain momentum without becoming defined by 
fear.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- Workshops II --&gt;
      &lt;div class=&quot;cf-sessions__block&quot;&gt;
        &lt;div class=&quot;cf-sessions__block-label&quot;&gt;Workshops Session II — 2:30 – 3:45 PM&lt;/div&gt;
        &lt;div class=&quot;cf-sessions__cards&quot;&gt;
          &lt;div class=&quot;cf-session&quot;&gt;
            &lt;span class=&quot;cf-session__track cf-session__track--pastoral&quot;&gt;Pastoral Track&lt;/span&gt;
            &lt;h3 class=&quot;cf-session__title&quot;&gt;Holding the Big Tent: Leading Across Ideological Difference&lt;/h3&gt;
            &lt;p class=&quot;cf-session__desc&quot;&gt;Theological and practical frameworks for maintaining unity without demanding uniformity. Strategies for facilitating ongoing conversations and nurturing a culture where courageous leadership doesn&#39;t mean creating division.&lt;/p&gt;
            &lt;p class=&quot;cf-session__facilitator&quot;&gt;Led by The Good Table&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cf-session&quot;&gt;
            &lt;span class=&quot;cf-session__track cf-session__track--community&quot;&gt;Community Track&lt;/span&gt;
            &lt;h3 class=&quot;cf-session__title&quot;&gt;You Are Not Alone: Supporting Clergy and Strengthening Congregations&lt;/h3&gt;
            &lt;p class=&quot;cf-session__desc&quot;&gt;Explore how congregational members can actively support pastoral leadership and strengthen the spiritual resilience of their communities, becoming places of solidarity, formation, and sustained courage.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ══════ CLOSING PANEL ══════ --&gt;
  &lt;section class=&quot;cf-panel&quot;&gt;
    &lt;div class=&quot;cf-panel__inner&quot;&gt;
      &lt;p class=&quot;cf-panel__label&quot;&gt;Closing Panel — 4:00 PM&lt;/p&gt;
      &lt;h2 class=&quot;cf-panel__heading&quot;&gt;Capacity for Courage: Building Faith Communities for the Long Haul&lt;/h2&gt;
      &lt;p class=&quot;cf-panel__body&quot;&gt;The conference concludes with a panel of pastors and congregational leaders reflecting on what it takes to build communities capable of sustained courage, moving beyond one-time moments of boldness to focus on formation, structure, and shared responsibility.&lt;/p&gt;
      &lt;div class=&quot;cf-panel__questions&quot;&gt;
        &lt;p class=&quot;cf-panel__q&quot;&gt;How do we nurture leaders who can speak and act with integrity?&lt;/p&gt;
        &lt;p class=&quot;cf-panel__q&quot;&gt;What forms of support help clergy endure fatigue and fear?&lt;/p&gt;
        &lt;p class=&quot;cf-panel__q&quot;&gt;How do congregations cultivate practices that strengthen courage over time?&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

            &lt;div class=&quot;cf-modal__gift-options&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;cf-modal__gift-chip&quot; data-gift=&quot;25&quot;&gt;$25&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;cf-modal__gift-chip&quot; data-gift=&quot;50&quot;&gt;$50&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;cf-modal__gift-chip&quot; data-gift=&quot;100&quot;&gt;$100&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;cf-modal__gift-chip&quot; data-gift=&quot;250&quot;&gt;$250&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;cf-modal__gift-chip&quot; data-gift=&quot;500&quot;&gt;$500&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;cf-modal__gift-chip&quot; data-gift=&quot;1000&quot;&gt;$1,000&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;cf-modal__gift-chip&quot; data-gift=&quot;other&quot;&gt;Other&lt;/button&gt;

            &lt;div class=&quot;cf-modal__gift-receipt&quot;&gt;
              &lt;strong&gt;Need a tax receipt?&lt;/strong&gt; Gifts added here are processed as part of your conference registration and do not include a tax receipt. If you would like a tax-receiptable donation, please give separately:&lt;br&gt;
              &lt;a href=&quot;https://www.paypal.com/donate?token=_e0pEG2CnZr2sw_JOzvCLmsOVWpHTtBDD5Ic4bToVx0MEFLF0u7Caj3f_3_2o54fCW4Gr56Bn0_hhdtS&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;U.S. Donors (via PayPal)&lt;/a&gt; &amp;nbsp;|&amp;nbsp;
              &lt;a href=&quot;https://icscanada.edu/donate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Canadian Donors (ICS website)&lt;/a&gt;
            &lt;/div&gt;

          &lt;p class=&quot;cf-modal__note&quot; style=&quot;margin-top: 0.6rem; margin-bottom: 0;&quot;&gt;Wrong country? Click the flag on the PayPal button to switch between Canadian and U.S. dollars.&lt;/p&gt;
          &lt;p class=&quot;cf-modal__note&quot;&gt;Questions? Email Héctor at &lt;a href=&quot;mailto:haceroferrer@icscanada.edu&quot;&gt;haceroferrer@icscanada.edu&lt;/a&gt;.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;!-- Confirmation state --&gt;
      &lt;div class=&quot;cf-modal__confirm&quot; id=&quot;cf-reg-confirm&quot;&gt;
        &lt;div class=&quot;cf-modal__confirm-icon&quot;&gt;
          &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M22 11.08V12a10 10 0 1 1-5.93-9.14&quot;/&gt;&lt;polyline points=&quot;22 4 12 14.01 9 11.01&quot;/&gt;&lt;/svg&gt;
        &lt;/div&gt;
        &lt;h3&gt;You&#39;re Registered!&lt;/h3&gt;
        &lt;p&gt;Thank you for registering for &lt;em&gt;Courageous Faith in a Time of Fear&lt;/em&gt;. You&#39;ll receive a confirmation from PayPal shortly.&lt;/p&gt;
        &lt;div class=&quot;cf-modal__confirm-livestream&quot; id=&quot;cf-confirm-livestream&quot;&gt;You selected the Keynotes Livestream option. You will receive a live streaming link and detailed instructions via email approximately two weeks before the conference (by April 29, 2026).&lt;/div&gt;
        &lt;div class=&quot;cf-modal__confirm-livestream&quot; id=&quot;cf-confirm-gift&quot;&gt;Thank you for your generous additional gift! Please note that this gift was processed as part of your conference registration and does not include a tax receipt. If you would like a tax-receiptable donation, you can give separately at &lt;a href=&quot;https://icscanada.edu/donate&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:var(--teal);font-weight:600;&quot;&gt;icscanada.edu/donate&lt;/a&gt; (Canada) or via &lt;a href=&quot;https://www.paypal.com/donate?token=_e0pEG2CnZr2sw_JOzvCLmsOVWpHTtBDD5Ic4bToVx0MEFLF0u7Caj3f_3_2o54fCW4Gr56Bn0_hhdtS&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; style=&quot;color:var(--teal);font-weight:600;&quot;&gt;PayPal&lt;/a&gt; (U.S.).&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;/div&gt;

&lt;!-- ══════ PayPal SDK + Registration Logic ══════ --&gt;
&lt;script src=&quot;https://www.paypal.com/sdk/js?client-id=AdZ0cWK3Bl7wjgmrmgk_On-ac13XCdpZxx8te_4IPlRDVoYx3ZNoGG8vK7mb8VXdKH2L-TM1M3sMj6oI&amp;currency=CAD&amp;intent=capture&amp;components=buttons&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(function() {
  /* ── Price map ── */
  var PRICES = {
    &#39;Full Conference ($150)&#39;: &#39;150.00&#39;,
    &#39;May 13 Only ($50)&#39;: &#39;50.00&#39;,
    &#39;May 13 Only + Morning Keynote ($60)&#39;: &#39;60.00&#39;,
    &#39;Keynotes Livestream ($25)&#39;: &#39;25.00&#39;
  };
  var PRICE_LABELS = {
    &#39;Full Conference ($150)&#39;: &#39;$150 CAD&#39;,
    &#39;May 13 Only ($50)&#39;: &#39;$50 CAD&#39;,
    &#39;May 13 Only + Morning Keynote ($60)&#39;: &#39;$60 CAD&#39;,
    &#39;Keynotes Livestream ($25)&#39;: &#39;$25 CAD&#39;
  };

  /* ── Element refs ── */
  var overlay   = document.getElementById(&#39;cf-reg-overlay&#39;);
  var formView  = document.getElementById(&#39;cf-reg-form-state&#39;);
  var confirm   = document.getElementById(&#39;cf-reg-confirm&#39;);
  var errBox    = document.getElementById(&#39;cf-reg-error&#39;);
  var priceBadge = document.getElementById(&#39;cf-price-badge&#39;);
  var livestreamNote = document.getElementById(&#39;cf-livestream-note&#39;);
  var confirmLivestream = document.getElementById(&#39;cf-confirm-livestream&#39;);
  var confirmGift = document.getElementById(&#39;cf-confirm-gift&#39;);
  var regTypeSelect = document.getElementById(&#39;cf-regtype&#39;);

  /* ── Required field IDs ── */
  var requiredFields = [&#39;cf-regtype&#39;,&#39;cf-fname&#39;,&#39;cf-lname&#39;,&#39;cf-email&#39;,
                        &#39;cf-address&#39;,&#39;cf-city&#39;,&#39;cf-province&#39;,&#39;cf-postal&#39;,&#39;cf-country&#39;];

  /* ── All field IDs (for reset) ── */
  var allFields = [&#39;cf-regtype&#39;,&#39;cf-fname&#39;,&#39;cf-lname&#39;,&#39;cf-email&#39;,
                   &#39;cf-address&#39;,&#39;cf-city&#39;,&#39;cf-province&#39;,&#39;cf-postal&#39;,&#39;cf-country&#39;,
                   &#39;cf-affiliation&#39;,&#39;cf-dietary&#39;];

  /* ── Gift state ── */
  var giftAmount = 0;
  var giftChips = document.querySelectorAll(&#39;.cf-modal__gift-chip&#39;);
  var giftCustomWrap = document.getElementById(&#39;cf-gift-custom&#39;);
  var giftCustomInput = document.getElementById(&#39;cf-gift-custom-input&#39;);
  var giftTotalEl = document.getElementById(&#39;cf-gift-total&#39;);

  function resetGift() {
    giftAmount = 0;
    giftChips.forEach(function(c) { c.classList.remove(&#39;is-selected&#39;); });
    giftCustomWrap.classList.remove(&#39;is-active&#39;);
    if (giftCustomInput) giftCustomInput.value = &#39;&#39;;
    giftTotalEl.classList.remove(&#39;is-active&#39;);
  }

  function updateGiftTotal() {
    var regType = getVal(&#39;cf-regtype&#39;);
    var regPrice = parseFloat(PRICES[regType] || &#39;0&#39;);
    if (giftAmount &gt; 0 &amp;&amp; regPrice &gt; 0) {
      var total = regPrice + giftAmount;
      giftTotalEl.textContent = &#39;Registration (&#39; + PRICE_LABELS[regType] + &#39;) + $&#39; + giftAmount.toFixed(0) + &#39; gift = $&#39; + total.toFixed(0) + &#39; CAD total&#39;;
      giftTotalEl.classList.add(&#39;is-active&#39;);
    } else {
      giftTotalEl.classList.remove(&#39;is-active&#39;);
    }
  }

  giftChips.forEach(function(chip) {
    chip.addEventListener(&#39;click&#39;, function() {
      var val = this.getAttribute(&#39;data-gift&#39;);

      /* If clicking the already-selected chip, deselect it */
      if (this.classList.contains(&#39;is-selected&#39;) &amp;&amp; val !== &#39;other&#39;) {
        this.classList.remove(&#39;is-selected&#39;);
        giftAmount = 0;
        giftCustomWrap.classList.remove(&#39;is-active&#39;);
        updateGiftTotal();
        return;
      }

      giftChips.forEach(function(c) { c.classList.remove(&#39;is-selected&#39;); });
      this.classList.add(&#39;is-selected&#39;);

      if (val === &#39;other&#39;) {
        giftCustomWrap.classList.add(&#39;is-active&#39;);
        giftCustomInput.focus();
        var custom = parseFloat(giftCustomInput.value);
        giftAmount = (custom &gt; 0) ? custom : 0;
      } else {
        giftCustomWrap.classList.remove(&#39;is-active&#39;);
        giftCustomInput.value = &#39;&#39;;
        giftAmount = parseFloat(val);
      }
      updateGiftTotal();
    });
  });

  if (giftCustomInput) {
    giftCustomInput.addEventListener(&#39;input&#39;, function() {
      var v = parseFloat(this.value);
      giftAmount = (v &gt; 0) ? v : 0;
      updateGiftTotal();
    });
  }

  /* Recalculate gift total when registration type changes */
  regTypeSelect.addEventListener(&#39;change&#39;, function() { updateGiftTotal(); });

  /* ── Google Form endpoint and entry IDs ── */
  var GFORM_URL = &#39;https://docs.google.com/forms/u/0/d/e/1FAIpQLSeehCcT68f29AmnSGqcQq1BsGXvLG5kZghku8q2-QSFOeatFg/formResponse&#39;;
  var ENTRY_MAP = {
    &#39;cf-fname&#39;:       &#39;entry.1585969271&#39;,
    &#39;cf-lname&#39;:       &#39;entry.1774834157&#39;,
    &#39;cf-email&#39;:       &#39;entry.1323223636&#39;,
    &#39;cf-address&#39;:     &#39;entry.704186288&#39;,
    &#39;cf-city&#39;:        &#39;entry.2031181760&#39;,
    &#39;cf-province&#39;:    &#39;entry.1573722972&#39;,
    &#39;cf-postal&#39;:      &#39;entry.1957045098&#39;,
    &#39;cf-country&#39;:     &#39;entry.907101756&#39;,
    &#39;cf-affiliation&#39;: &#39;entry.545241140&#39;,
    &#39;cf-regtype&#39;:     &#39;entry.909016893&#39;,
    &#39;cf-dietary&#39;:     &#39;entry.212256401&#39;
  };

  /* ── Helpers ── */
  function getVal(id) { return document.getElementById(id).value.trim(); }

  var COUNTRY_CODES = {
    &#39;canada&#39;:&#39;CA&#39;,&#39;ca&#39;:&#39;CA&#39;,&#39;can&#39;:&#39;CA&#39;,
    &#39;united states&#39;:&#39;US&#39;,&#39;united states of america&#39;:&#39;US&#39;,&#39;usa&#39;:&#39;US&#39;,&#39;us&#39;:&#39;US&#39;,&#39;u.s.&#39;:&#39;US&#39;,&#39;u.s.a.&#39;:&#39;US&#39;,
    &#39;united kingdom&#39;:&#39;GB&#39;,&#39;uk&#39;:&#39;GB&#39;,&#39;great britain&#39;:&#39;GB&#39;,&#39;england&#39;:&#39;GB&#39;,&#39;scotland&#39;:&#39;GB&#39;,&#39;wales&#39;:&#39;GB&#39;,
    &#39;australia&#39;:&#39;AU&#39;,&#39;au&#39;:&#39;AU&#39;,
    &#39;new zealand&#39;:&#39;NZ&#39;,&#39;nz&#39;:&#39;NZ&#39;,
    &#39;germany&#39;:&#39;DE&#39;,&#39;deutschland&#39;:&#39;DE&#39;,
    &#39;france&#39;:&#39;FR&#39;,
    &#39;netherlands&#39;:&#39;NL&#39;,&#39;the netherlands&#39;:&#39;NL&#39;,&#39;holland&#39;:&#39;NL&#39;,
    &#39;belgium&#39;:&#39;BE&#39;,
    &#39;switzerland&#39;:&#39;CH&#39;,
    &#39;ireland&#39;:&#39;IE&#39;,
    &#39;south africa&#39;:&#39;ZA&#39;,
    &#39;mexico&#39;:&#39;MX&#39;,&#39;méxico&#39;:&#39;MX&#39;,
    &#39;brazil&#39;:&#39;BR&#39;,&#39;brasil&#39;:&#39;BR&#39;,
    &#39;india&#39;:&#39;IN&#39;,
    &#39;china&#39;:&#39;CN&#39;,
    &#39;japan&#39;:&#39;JP&#39;,
    &#39;south korea&#39;:&#39;KR&#39;,&#39;korea&#39;:&#39;KR&#39;,
    &#39;italy&#39;:&#39;IT&#39;,
    &#39;spain&#39;:&#39;ES&#39;,
    &#39;portugal&#39;:&#39;PT&#39;,
    &#39;sweden&#39;:&#39;SE&#39;,
    &#39;norway&#39;:&#39;NO&#39;,
    &#39;denmark&#39;:&#39;DK&#39;,
    &#39;finland&#39;:&#39;FI&#39;,
    &#39;austria&#39;:&#39;AT&#39;,
    &#39;poland&#39;:&#39;PL&#39;,
    &#39;czech republic&#39;:&#39;CZ&#39;,&#39;czechia&#39;:&#39;CZ&#39;,
    &#39;hungary&#39;:&#39;HU&#39;,
    &#39;romania&#39;:&#39;RO&#39;,
    &#39;greece&#39;:&#39;GR&#39;,
    &#39;turkey&#39;:&#39;TR&#39;,&#39;türkiye&#39;:&#39;TR&#39;,
    &#39;israel&#39;:&#39;IL&#39;,
    &#39;singapore&#39;:&#39;SG&#39;,
    &#39;philippines&#39;:&#39;PH&#39;,
    &#39;nigeria&#39;:&#39;NG&#39;,
    &#39;kenya&#39;:&#39;KE&#39;,
    &#39;ghana&#39;:&#39;GH&#39;,
    &#39;colombia&#39;:&#39;CO&#39;,
    &#39;argentina&#39;:&#39;AR&#39;,
    &#39;chile&#39;:&#39;CL&#39;,
    &#39;peru&#39;:&#39;PE&#39;
  };
  function countryToCode(name) {
    if (!name) return &#39;&#39;;
    var key = name.toLowerCase().trim();
    if (COUNTRY_CODES[key]) return COUNTRY_CODES[key];
    /* If the user typed a 2-letter code directly */
    if (/^[a-z]{2}$/.test(key)) return key.toUpperCase();
    return &#39;&#39;;
  }

  function validate() {
    var valid = true;
    errBox.classList.remove(&#39;is-active&#39;);
    requiredFields.forEach(function(id) {
      var el = document.getElementById(id);
      el.classList.remove(&#39;is-invalid&#39;);
      if (!el.value.trim()) { el.classList.add(&#39;is-invalid&#39;); valid = false; }
    });
    /* Basic email check */
    var emailEl = document.getElementById(&#39;cf-email&#39;);
    if (emailEl.value.trim() &amp;&amp; !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value.trim())) {
      emailEl.classList.add(&#39;is-invalid&#39;); valid = false;
    }
    if (!valid) {
      errBox.textContent = &#39;Please fill in all required fields before proceeding.&#39;;
      errBox.classList.add(&#39;is-active&#39;);
    }
    return valid;
  }

  function submitToGoogleSheet() {
    var formData = new URLSearchParams();
    Object.keys(ENTRY_MAP).forEach(function(fieldId) {
      var val = getVal(fieldId);
      /* Append gift amount to dietary/accessibility field */
      if (fieldId === &#39;cf-dietary&#39; &amp;&amp; giftAmount &gt; 0) {
        val = (val ? val + &#39; | &#39; : &#39;&#39;) + &#39;Additional gift: $&#39; + giftAmount.toFixed(0) + &#39; CAD&#39;;
      }
      formData.append(ENTRY_MAP[fieldId], val);
    });
    return fetch(GFORM_URL, {
      method: &#39;POST&#39;,
      mode: &#39;no-cors&#39;,
      headers: { &#39;Content-Type&#39;: &#39;application/x-www-form-urlencoded&#39; },
      body: formData.toString()
    });
  }

  /* ── Registration type change handler ── */
  regTypeSelect.addEventListener(&#39;change&#39;, function() {
    var val = this.value;
    if (val &amp;&amp; PRICE_LABELS[val]) {
      priceBadge.textContent = PRICE_LABELS[val];
    } else {
      priceBadge.textContent = &#39;Select a registration type&#39;;
    }
    if (val === &#39;Keynotes Livestream ($25)&#39;) {
      livestreamNote.classList.add(&#39;is-active&#39;);
    } else {
      livestreamNote.classList.remove(&#39;is-active&#39;);
    }
  });

  /* ── Open / Close modal ── */
  window.cfOpenReg = function() {
    formView.style.display = &#39;&#39;;
    confirm.classList.remove(&#39;is-active&#39;);
    errBox.classList.remove(&#39;is-active&#39;);
    livestreamNote.classList.remove(&#39;is-active&#39;);
    confirmLivestream.classList.remove(&#39;is-active&#39;);
    if (confirmGift) confirmGift.classList.remove(&#39;is-active&#39;);
    priceBadge.textContent = &#39;Select a registration type&#39;;
    allFields.forEach(function(id) {
      var el = document.getElementById(id);
      el.value = &#39;&#39;; el.classList.remove(&#39;is-invalid&#39;);
    });
    resetGift();
    overlay.classList.add(&#39;is-active&#39;);
    document.body.style.overflow = &#39;hidden&#39;;
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        overlay.classList.add(&#39;is-visible&#39;);
      });
    });
  };

  window.cfCloseReg = function() {
    overlay.classList.remove(&#39;is-visible&#39;);
    setTimeout(function() {
      overlay.classList.remove(&#39;is-active&#39;);
      document.body.style.overflow = &#39;&#39;;
    }, 300);
  };

  overlay.addEventListener(&#39;click&#39;, function(e) {
    if (e.target === overlay) cfCloseReg();
  });
  document.addEventListener(&#39;keydown&#39;, function(e) {
    if (e.key === &#39;Escape&#39; &amp;&amp; overlay.classList.contains(&#39;is-active&#39;)) cfCloseReg();
  });

  /* ── PayPal Buttons ── */
  if (typeof paypal !== &#39;undefined&#39;) {
    var loadingEl = document.querySelector(&#39;#cf-paypal-container .cf-paypal-loading&#39;);
    if (loadingEl) loadingEl.remove();

    paypal.Buttons({
      style: {
        layout: &#39;vertical&#39;,
        color:  &#39;blue&#39;,
        shape:  &#39;pill&#39;,
        label:  &#39;pay&#39;,
        height: 48
      },

      onClick: function(data, actions) {
        if (!validate()) return actions.reject();
        return actions.resolve();
      },

      createOrder: function(data, actions) {
        var regType  = getVal(&#39;cf-regtype&#39;);
        var baseAmount = parseFloat(PRICES[regType] || &#39;0&#39;);
        var totalAmount = (baseAmount + giftAmount).toFixed(2);
        var fullName = getVal(&#39;cf-fname&#39;) + &#39; &#39; + getVal(&#39;cf-lname&#39;);
        var email    = getVal(&#39;cf-email&#39;);
        var countryCode = countryToCode(getVal(&#39;cf-country&#39;));

        var description = &#39;Courageous Faith Conference: &#39; + regType + &#39; | &#39; + fullName + &#39; | &#39; + email;
        if (giftAmount &gt; 0) {
          description += &#39; | Gift: $&#39; + giftAmount.toFixed(0);
        }

        var orderData = {
          purchase_units: [{
            description: description,
            amount: {
              currency_code: &#39;CAD&#39;,
              value: totalAmount
            }
          }],
          application_context: {
            brand_name: &#39;Free to be Faithful - ICS&#39;,
            shipping_preference: &#39;NO_SHIPPING&#39;
          }
        };

        if (countryCode) {
          orderData.payer = {
            name: { given_name: getVal(&#39;cf-fname&#39;), surname: getVal(&#39;cf-lname&#39;) },
            email_address: getVal(&#39;cf-email&#39;),
            address: { country_code: countryCode }
          };
        }

        return actions.order.create(orderData);
      },

      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          var wasLivestream = getVal(&#39;cf-regtype&#39;) === &#39;Keynotes Livestream ($25)&#39;;
          var hadGift = giftAmount &gt; 0;
          submitToGoogleSheet().then(function() {
            formView.style.display = &#39;none&#39;;
            confirm.classList.add(&#39;is-active&#39;);
            if (wasLivestream) confirmLivestream.classList.add(&#39;is-active&#39;);
            if (hadGift) {
              var giftMsg = document.getElementById(&#39;cf-confirm-gift&#39;);
              if (giftMsg) giftMsg.classList.add(&#39;is-active&#39;);
            }
          }).catch(function() {
            formView.style.display = &#39;none&#39;;
            confirm.classList.add(&#39;is-active&#39;);
            if (wasLivestream) confirmLivestream.classList.add(&#39;is-active&#39;);
            if (hadGift) {
              var giftMsg = document.getElementById(&#39;cf-confirm-gift&#39;);
              if (giftMsg) giftMsg.classList.add(&#39;is-active&#39;);
            }
          });
        });
      },

      onError: function(err) {
        errBox.textContent = &#39;Something went wrong with the payment. Please try again or contact info@icscanada.edu.&#39;;
        errBox.classList.add(&#39;is-active&#39;);
        console.error(&#39;PayPal error:&#39;, err);
      }

    }).render(&#39;#cf-paypal-container&#39;);
  }
})();
&lt;/script&gt;
